services:
  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE must be set in .env}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER must be set in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
      TZ: Europe/Madrid
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --protocol=tcp -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - huddle_net

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: ${DB_PORT:?DB_PORT must be set in .env}
      DB_NAME: ${MYSQL_DATABASE:?MYSQL_DATABASE must be set in .env}
      DB_USER: ${MYSQL_USER:?MYSQL_USER must be set in .env}
      DB_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      TZ: Europe/Madrid
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped
    networks:
      - huddle_net

  adminer:
    image: adminer:4
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
      TZ: Europe/Madrid
    ports:
      - "${ADMINER_PORT:-8081}:8080"
    networks:
      - huddle_net

volumes:
  db_data:

networks:
  huddle_net:
    driver: bridge